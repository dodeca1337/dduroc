[package]
name = "dduroc"
description = "Система логирования и телеметрии для embedded Linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Слой чтения включён по умолчанию: на устройстве журнал показывает сам прибор.
# Прошивке, которая только пишет, его можно отключить — на armv7 с ограниченным
# флешем размер бинаря значим.
default = ["read"]
read = ["dep:dduroc-read"]

[dependencies]
chrono.workspace = true
dduroc-engine.workspace = true
dduroc-read = { workspace = true, optional = true }
dduroc-format.workspace = true
dduroc-macros.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true
dduroc-read.workspace = true
tempfile.workspace = true

[[bench]]
name = "hot_path"
harness = false
