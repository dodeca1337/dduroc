[package]
name = "dduroc"
description = "A logging and telemetry system for embedded Linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
include = ["src/**", "examples/**", "tests/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# The read layer is on by default: on a device the journal is shown by the
# device itself. Firmware that only writes can turn it off — on armv7 with
# limited flash the binary size matters.
default = ["read"]
read = ["dep:dduroc-read"]
recovery = ["dduroc-engine/recovery"]

[dependencies]
chrono.workspace = true
dduroc-engine.workspace = true
dduroc-read = { workspace = true, optional = true }
dduroc-format.workspace = true
dduroc-macros.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Fixture-only rewriting exercises tied timestamps without a production clock override.
raft-engine.workspace = true
protobuf.workspace = true
criterion.workspace = true
dduroc-read.workspace = true
tempfile.workspace = true

[[bench]]
name = "hot_path"
harness = false
required-features = ["read"]

[[example]]
name = "02_viewer_reads"
required-features = ["read"]

[[example]]
name = "03_schema_grows"
required-features = ["read"]

[[example]]
name = "04_operations"
required-features = ["read"]

[package.metadata.docs.rs]
features = ["recovery"]
