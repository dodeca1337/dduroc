[package]
name = "dduroc"
description = "A logging and telemetry system for embedded Linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The read layer is on by default: on a device the journal is shown by the
# device itself. Firmware that only writes can turn it off — on armv7 with
# limited flash the binary size matters.
default = ["read"]
read = ["dep:dduroc-read"]

[dependencies]
chrono.workspace = true
dduroc-engine.workspace = true
dduroc-read = { workspace = true, optional = true }
dduroc-format.workspace = true
dduroc-macros.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true
dduroc-read.workspace = true
tempfile.workspace = true

[[bench]]
name = "hot_path"
harness = false
