[package]
name = "dduroc-engine"
description = "Compact event storage on Raft Engine: durability, namespace quotas, retention and migrations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
include = ["src/**", "examples/**", "tests/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
dduroc-format.workspace = true
raft-engine.workspace = true
protobuf.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
postcard.workspace = true
rustix.workspace = true
serde.workspace = true
smallvec.workspace = true
sha2 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
default = []
recovery = ["dep:sha2", "dep:serde_json"]

[[example]]
name = "recover_copy"
required-features = ["recovery"]

[package.metadata.docs.rs]
features = ["recovery"]
