[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
# The device target is armv7-unknown-linux-gnueabihf, cross-built with
# cargo-zigbuild. The target is deliberately not declared here: otherwise any
# local `cargo test` would require downloading it. For cross-building, once:
#   rustup target add armv7-unknown-linux-gnueabihf
#   cargo zigbuild --release --target armv7-unknown-linux-gnueabihf
#
# A type check for the 32-bit target needs no linker and is therefore available
# right after `rustup target add` — in CI it is a job of its own
# (.github/workflows):
#   cargo check --workspace --all-targets --target armv7-unknown-linux-gnueabihf
# Assumptions about the width of usize never show up on x86-64, while on a
# device they turn into a "capacity overflow" panic over someone else's file.
