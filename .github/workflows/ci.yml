name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version and the components come from rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  # The device target is 32-bit while development happens on x86-64:
  # assumptions about the width of usize (capacities from counters in a file,
  # buffer sizes, offset arithmetic) never show up on the host. A compilation
  # check catches them sooner than a device does.
  #
  # `check` rather than `build`: linking would need a cross toolchain, and what
  # has to be checked is the type check, not the linker. Tests are not run on
  # the target — that needs an emulator, which is a task of its own.
  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: armv7
      - run: cargo check --workspace --all-targets --target armv7-unknown-linux-gnueabihf
