[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Dodeca Shaven <dodeca@tutamail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dodeca1337/dduroc"
readme = "README.md"
keywords = ["logging", "telemetry", "embedded", "journal"]
categories = ["embedded", "development-tools::debugging"]
rust-version = "1.88"

[workspace]
resolver = "3"
members = [
    "crates/dduroc",
    "crates/dduroc-engine",
    "crates/dduroc-format",
    "crates/dduroc-macros",
    "crates/dduroc-read",
    "crates/dduroc-graphql",
    "crates/dduroc-web",
]

[workspace.dependencies]
# ── the core (sync, armv7-friendly) ───────────────────────────────────────────
crc32c = "0.6"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
thiserror = "2.0"
rustix = { version = "1.1", features = ["fs", "time", "process"] }
crossbeam-channel = "0.5"
smallvec = { version = "1", features = ["union"] }
raft-engine = { version = "=0.4.2", default-features = false, features = ["std_fs"] }
protobuf = "2.28"
# 7.0.17 is the last family supporting this workspace's Rust 1.88 minimum.
async-graphql = { version = "=7.0.17", default-features = false }
async-graphql-derive = "=7.0.17"
async-graphql-parser = "=7.0.17"
async-graphql-value = "=7.0.17"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.3"
base64 = "0.22"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
async-graphql-axum = "=7.0.17"
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"

# Wall-clock time is UTC only: a device does not need time zones, and `clock`
# would drag in the zone database (iana-time-zone). `now` gives `Utc::now()`
# without it.
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }

# ── serde / payload ───────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }

# ── tests ─────────────────────────────────────────────────────────────────────
proptest = "1.7"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
serde_json = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

# ── internal ──────────────────────────────────────────────────────────────────
dduroc = { version = "=0.2.0", path = "crates/dduroc" }
dduroc-graphql = { version = "=0.2.0", path = "crates/dduroc-graphql" }
dduroc-web = { version = "=0.2.0", path = "crates/dduroc-web" }
dduroc-format = { version = "=0.2.0", path = "crates/dduroc-format" }
dduroc-engine = { version = "=0.2.0", path = "crates/dduroc-engine" }
dduroc-read = { version = "=0.2.0", path = "crates/dduroc-read" }
dduroc-macros = { version = "=0.2.0", path = "crates/dduroc-macros" }

[profile.release]
# The target platform is armv7 with limited flash: the binary size matters.
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
